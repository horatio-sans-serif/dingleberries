[project]
name = "dingleberries"
version = "1.0.0"
description = "Gitignore hygiene tool - detect files that should be ignored"
requires-python = ">=3.11"
dependencies = [
    "pathspec>=0.12",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
